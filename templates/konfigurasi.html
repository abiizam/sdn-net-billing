{% extends "base.html" %}
{% block title %}Konfigurasi — SDN NET BILLING{% endblock %}
{% block content %}
<h2 class="mb-4">⚙️ Konfigurasi MikroTik & OLT</h2>

<div class="card mb-4">
    <div class="card-header bg-light">
        <h5>🔧 Pengaturan MikroTik</h5>
    </div>
    <div class="card-body">
        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">IP Address</label>
                    <input type="text" class="form-control" placeholder="192.168.88.1">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Port</label>
                    <input type="number" class="form-control" value="8728">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" placeholder="admin">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control">
                </div>
            </div>
            <button type="button" class="btn btn-success">🔌 Tes Koneksi MikroTik</button>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header bg-light">
        <h5>🔧 Pengaturan OLT</h5>
    </div>
    <div class="card-body">
        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">IP Address</label>
                    <input type="text" class="form-control" placeholder="192.168.1.100">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Port</label>
                    <input type="number" class="form-control" value="23">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" placeholder="admin">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control">
                </div>
            </div>
            <button type="button" class="btn btn-success">🔌 Tes Koneksi OLT</button>
            <button type="button" class="btn btn-primary ms-2">💾 Simpan Konfigurasi</button>
        </form>
    </div>
</div>

<div class="mt-4">
    <a href="/dashboard" class="btn btn-secondary">← Kembali ke Dashboard</a>
</div>
{% endblock %}
